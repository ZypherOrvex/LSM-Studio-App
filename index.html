<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12111F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LSM Studio</title>
<style>
:root{--bg:#12111F;--s1:#1B1930;--s2:#252244;--ln:#332F57;--tx:#ECEAFB;--mu:#9B98C2;--ac:#8F7BFF;--ok:#4FD1A5;--dn:#FF6B8A;--r:14px}
[data-theme=light]{--bg:#F5F4FB;--s1:#FFFFFF;--s2:#ECEAF7;--ln:#D9D6EE;--tx:#1B1936;--mu:#6C6896;--ac:#6B54F0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{resize:none;min-height:90px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
small,.mu{color:var(--mu)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 0}
.top .wrap{display:flex;align-items:center;gap:8px}
.ib{width:38px;height:38px;border-radius:10px;background:var(--s1);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.crumbs{flex:1;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;align-items:center}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:6px 9px;border-radius:8px;color:var(--mu);font-size:13px}
.crumb.last{color:var(--tx);font-weight:600}
.sep{color:var(--ln)}
/* titles */
.hero{padding:16px 0 6px;display:flex;gap:12px;align-items:center}
.tile{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--s2);border:1px solid var(--c);flex:none}
.tile{background:color-mix(in srgb,var(--c) 22%,var(--s1));border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.hero .tile{width:54px;height:54px;font-size:27px}
.hero h1{font-size:22px;line-height:1.15;word-break:break-word}
.sec{margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:15px;color:var(--mu);font-weight:600}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin-bottom:10px}
/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.row .rt{flex:1;min-width:0}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:12.5px}
.chev{color:var(--mu);font-size:20px}
.bar{height:5px;border-radius:5px;background:var(--s2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;background:var(--c);color:#14122B}
.tgs-outline .tg{background:transparent;color:var(--c);border:1px solid var(--c)}
.tgs-dot .tg{background:transparent;color:var(--tx);padding-left:0}
.tgs-dot .tg::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.tgs-pill .tg{border-radius:20px}
.add{border:1px dashed var(--ln);color:var(--mu);border-radius:10px;padding:2px 9px;font-size:12px}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#fff;font-weight:600}
.btn{background:var(--ac);color:#fff;font-weight:600;padding:11px 16px;border-radius:12px;text-align:center;display:block;width:100%}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.dn{background:var(--dn);color:#14122B}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px}
.gap{height:8px}
.empty{text-align:center;color:var(--mu);padding:26px 10px;border:1px dashed var(--ln);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:10px}
.stat b{font-size:24px;display:block}
.stat small{font-size:12px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;height:62px}
.nav button.t{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mu);font-size:11px}
.nav button.t span{font-size:20px}
.nav button.t.on{color:var(--ac);font-weight:700}
.fab{width:56px;height:56px;border-radius:18px;background:var(--ac);color:#fff;font-size:30px;margin:-22px auto 0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
/* sheet */
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:none}
#sheet.on{display:block}
.sh-back{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,4,15,.6)}
.sh-box{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);max-width:720px;margin:0 auto}
.grab{width:42px;height:4px;border-radius:4px;background:var(--ln);margin:4px auto 12px}
.sh-box h3{font-size:18px;margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin-bottom:8px}
.opt .em{font-size:24px;width:34px;text-align:center}
.opt b{display:block}
.opt small{display:block}
.lab{display:block;font-size:12.5px;color:var(--mu);margin:12px 0 5px}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.icons button{font-size:22px;padding:6px;border-radius:10px;background:var(--s1);border:1px solid var(--ln)}
.icons button.on{border-color:var(--ac);background:var(--s2)}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid transparent}
.cols button.on{border-color:var(--tx)}
.chk{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--ln)}
.chk input{width:20px;height:20px;flex:none}
/* blocks */
.blk{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.bh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ln)}
.bh b{font-size:14px}
.bh .tp{font-size:11.5px;color:var(--mu);margin-left:6px}
.bb{padding:10px 12px}
.li{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.li input.lt{background:transparent;border-color:transparent;padding:6px}
.li.done input.lt{text-decoration:line-through;color:var(--mu)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--ln);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;font-weight:900}
.ck.on{background:var(--ok);border-color:var(--ok);color:#14122B}
.sm-x{color:var(--mu);font-size:18px;padding:4px 8px}
.fr{display:grid;grid-template-columns:105px 1fr 24px;gap:8px;align-items:center;margin-bottom:8px}
.fr label{font-size:13px;color:var(--mu)}
.tw{overflow-x:auto}
table{border-collapse:collapse;min-width:100%}
td,th{padding:3px;border:1px solid var(--ln)}
td input,th input{border:0;background:transparent;min-width:110px;padding:6px}
th input{font-weight:700}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--s2)}
.lk{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.lk a{color:var(--ac);text-decoration:none;word-break:break-all;flex:1}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.colm{min-width:220px;flex:none}
.colm h4{margin:0 0 8px;font-size:13px;color:var(--mu)}
.kc{background:var(--s1);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:12px;padding:10px;margin-bottom:8px;width:100%;text-align:left;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:var(--s1);border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:var(--r);padding:12px;text-align:left}
.gc .em{font-size:28px;display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13.5px;z-index:40;max-width:90%}
.hist{border-left:2px solid var(--ln);padding:0 0 12px 12px;margin-left:6px;position:relative}
.hist::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:460px;margin:0 auto}
.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#8F7BFF,#4FD1A5);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#14122B;margin-bottom:18px}
.note{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<datalist id="people"></datalist>
<input type="file" id="imp" accept="application/json,.json" style="display:none">
<script>
(function(){
'use strict';
var KEY='lsm_studio_v01';
var COLORS=['#8F7BFF','#5EA8FF','#4FD1A5','#F2C94C','#FF9F5A','#FF6B8A','#C77DFF','#9AA3B2'];
var ICONS=['📁','📂','📄','📝','✅','💡','🎯','🔍','🎬','🎭','👤','👥','🔧','📦','🌐','📱','💻','🏠','📚','🐞','⚙️','⭐','🔒','🔔','🖼','🔗','🎮','🎵','🚀','🛠','📅','📊','💬','🤖','🗂'];
var FT={text:'Texto',date:'Fecha',person:'Persona',number:'Número',link:'Enlace',select:'Opciones'};
var BT={text:['📝','Texto','Escribir libremente'],list:['✅','Lista','Pendientes con casillas'],ficha:['📋','Ficha','Campos ordenados'],tabla:['▦','Tabla','Filas y columnas'],links:['🔗','Enlaces','Fuentes y referencias'],gallery:['🖼','Galería','Imágenes por enlace'],files:['📎','Archivos','Adjuntos (llega con Drive)']};
var VIS={inherit:'Heredar',public:'Público',semi:'Semi público',private:'Privado'};
var VICO={public:'🌐',semi:'🔔',private:'🔒'};
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var now=function(){return Date.now()};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function fmt(t){var d=new Date(t);return d.toLocaleDateString('es',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}

/* ---------- datos ---------- */
var db=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
var saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('No se pudo guardar (almacenamiento lleno)')}}
function defTags(){
  var e=[['t_idea','Idea','#C77DFF'],['t_pend','Pendiente','#9AA3B2'],['t_proc','En proceso','#5EA8FF'],['t_rev','En revisión','#F2C94C'],['t_ok','Terminado','#4FD1A5'],['t_pau','Pausado','#FF9F5A'],['t_can','Cancelado','#FF6B8A']];
  var p=[['t_baja','Baja','#4FD1A5'],['t_media','Media','#F2C94C'],['t_alta','Alta','#FF9F5A'],['t_urg','Urgente','#FF6B8A']];
  var out=[];e.forEach(function(x){out.push({id:x[0],g:'g_estado',n:x[1],c:x[2]})});p.forEach(function(x){out.push({id:x[0],g:'g_prio',n:x[1],c:x[2]})});return out;
}
function newDb(name,color){
  db={v:1,user:{name:name,color:color},nodes:{},kits:[],tags:defTags(),groups:[{id:'g_estado',n:'Estado'},{id:'g_prio',n:'Prioridad'}],log:[],people:['Luka','Lumedia','Michelino'],set:{theme:'dark',tagStyle:'fill'},root:null};
  if(db.people.indexOf(name)<0)db.people.push(name);
  var r=make({t:'folder',n:'LSM Studio',ic:'🏠',co:'#8F7BFF',children:[]},null,'LSM Studio');
  r.vis='semi';db.root=r.id;saveNow();
}

/* ---------- bloques y kits ---------- */
function makeBlock(s){
  var b={id:uid(),type:s.type,title:s.title||BT[s.type][1],data:{}};
  if(s.type==='text')b.data={text:''};
  else if(s.type==='list')b.data={items:[]};
  else if(s.type==='ficha')b.data={fields:(s.fields||[]).map(function(f){return {id:uid(),l:f[0],type:f[1]||'text',v:'',o:f[2]?String(f[2]).split('|'):[]}})};
  else if(s.type==='tabla')b.data={cols:(s.cols||['Columna 1','Columna 2']).slice(),rows:[]};
  else if(s.type==='links'||s.type==='gallery')b.data={items:[]};
  return b;
}
function FK(id,n,ic,co,cat,desc,blocks,tags){return {id:id,t:'file',n:n,ic:ic,co:co,cat:cat,desc:desc,blocks:blocks,tags:tags||[],builtin:true}}
function DK(id,n,ic,co,desc,children){return {id:id,t:'folder',n:n,ic:ic,co:co,cat:'Carpetas con kit',desc:desc,children:children,tags:['t_pend'],builtin:true}}
var BUILTIN=[
 FK('resumen','Resumen','📋','#8F7BFF','General','Ficha general con descripción',[{type:'ficha',title:'Datos',fields:[['Responsable','person'],['Inicio','date'],['Fin','date'],['Enlace','link']]},{type:'text',title:'Descripción'}]),
 FK('tareas','Tareas','✅','#4FD1A5','General','Lista de pendientes',[{type:'list',title:'Pendientes'}]),
 FK('idea','Idea','💡','#C77DFF','General','Idea que luego puede ser proyecto o tarea',[{type:'ficha',title:'Datos',fields:[['Origen','text'],['Fecha','date'],['Responsable','person']]},{type:'text',title:'Descripción'}],['t_idea']),
 FK('objetivo','Objetivo','🎯','#FF9F5A','General','Meta con hitos',[{type:'ficha',title:'Meta',fields:[['Meta','text'],['Fecha límite','date'],['Avance %','number']]},{type:'list',title:'Hitos'}]),
 FK('investigacion','Investigación','🔍','#5EA8FF','General','Fuentes y conclusiones',[{type:'links',title:'Fuentes'},{type:'text',title:'Conclusiones'}]),
 FK('sugerencia','Sugerencia','📣','#F2C94C','General','Propuesta del equipo',[{type:'ficha',title:'Datos',fields:[['Autor','person'],['Fecha','date']]},{type:'text',title:'Sugerencia'}]),
 FK('opinion','Opinión','💬','#FF6B8A','General','Opinión o comentario',[{type:'ficha',title:'Datos',fields:[['Autor','person'],['Fecha','date']]},{type:'text',title:'Opinión'}]),
 FK('documento','Documento','📝','#9AA3B2','General','Texto libre',[{type:'text',title:'Contenido'}]),
 FK('bitacora','Bitácora','📓','#9AA3B2','General','Notas del día a día',[{type:'text',title:'Bitácora'}]),
 FK('personaje','Ficha de personaje','🎭','#C77DFF','Producción','Datos de un personaje',[{type:'gallery',title:'Imágenes'},{type:'ficha',title:'Datos',fields:[['Rol','text'],['Edad','text'],['Apariencia','text'],['Habilidades','text']]},{type:'text',title:'Historia'}]),
 FK('guion','Guion','📜','#5EA8FF','Producción','Guion de un capítulo o escena',[{type:'text',title:'Guion'}]),
 FK('versiones','Versiones','🏷','#4FD1A5','Desarrollo','Historial de versiones',[{type:'tabla',title:'Versiones',cols:['Versión','Fecha','Cambios']}]),
 FK('errores','Errores','🐞','#FF6B8A','Desarrollo','Lista de bugs',[{type:'tabla',title:'Errores',cols:['Error','Gravedad','Estado','Responsable']}]),
 DK('proyecto','Proyecto','🗂','#8F7BFF','Resumen, tareas, ideas, objetivos, investigación, archivos y bitácora',[{n:'Resumen',k:'resumen'},{n:'Tareas',k:'tareas'},{n:'Ideas',t:'folder'},{n:'Objetivos',k:'objetivo'},{n:'Investigación',t:'folder'},{n:'Archivos',t:'folder'},{n:'Bitácora',k:'bitacora'}]),
 DK('serie','Serie','🎬','#FF6B8A','Ficha, personajes, capítulos, mundo, tareas y archivos',[{n:'Ficha de la serie',k:'resumen'},{n:'Personajes',t:'folder'},{n:'Capítulos',t:'folder'},{n:'Mundo y lore',k:'documento'},{n:'Tareas',k:'tareas'},{n:'Archivos',t:'folder'}]),
 DK('capitulo','Capítulo','🎞','#FF9F5A','Ficha, guion, escenas, tareas de producción y material',[{n:'Ficha',k:'resumen'},{n:'Guion',k:'guion'},{n:'Escenas',t:'folder'},{n:'Tareas de producción',k:'tareas'},{n:'Material',t:'folder'}]),
 DK('programa','Programa','💻','#5EA8FF','Ficha técnica, tareas, versiones, errores y documentación',[{n:'Ficha técnica',k:'resumen'},{n:'Tareas',k:'tareas'},{n:'Versiones',k:'versiones'},{n:'Errores',k:'errores'},{n:'Documentación',k:'documento'},{n:'Archivos',t:'folder'}]),
 DK('app','App','📱','#4FD1A5','Como Programa, más una carpeta de diseño',[{n:'Ficha técnica',k:'resumen'},{n:'Tareas',k:'tareas'},{n:'Versiones',k:'versiones'},{n:'Errores',k:'errores'},{n:'Documentación',k:'documento'},{n:'Diseño',t:'folder'},{n:'Archivos',t:'folder'}]),
 DK('web','Web','🌐','#C77DFF','Como Programa, más una carpeta de páginas',[{n:'Ficha técnica',k:'resumen'},{n:'Tareas',k:'tareas'},{n:'Versiones',k:'versiones'},{n:'Errores',k:'errores'},{n:'Páginas',t:'folder'},{n:'Documentación',k:'documento'},{n:'Archivos',t:'folder'}]),
 DK('area','Área','🏢','#F2C94C','Espacio de una persona o equipo',[{n:'Resumen',k:'resumen'},{n:'Proyectos',t:'folder'},{n:'Ideas',t:'folder'},{n:'Objetivos',t:'folder'}])
];
var EMPTY_FILE={id:null,t:'file',n:'Archivo nuevo',ic:'📄',co:'#9AA3B2',blocks:[],tags:[]};
var EMPTY_FOLDER={id:null,t:'folder',n:'Carpeta nueva',ic:'📁',co:'#9AA3B2',children:[],tags:[]};
function allKits(){return BUILTIN.concat(db.kits)}
function getKit(id){var a=allKits();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function resolveChild(ch){if(ch.spec)return ch.spec;if(ch.k){var k=getKit(ch.k);if(k)return k}return ch.t==='file'?EMPTY_FILE:EMPTY_FOLDER}
function make(spec,parent,name,skip){
  var n={id:uid(),p:parent,t:spec.t,n:name||spec.n,ic:spec.ic,co:spec.co,k:spec.id||null,vis:'inherit',tags:(spec.tags||[]).slice(),blocks:[],view:'list',log:[],c:now(),u:now(),by:db.user.name,del:null};
  db.nodes[n.id]=n;
  if(spec.t==='file')(spec.blocks||[]).forEach(function(b){n.blocks.push(makeBlock(b))});
  addLog(n,'Creó',spec.id?'con el kit «'+spec.n+'»':(spec.t==='folder'&&!spec.children?'':'vacío'));
  if(spec.t==='folder')(spec.children||[]).forEach(function(ch,i){if(skip&&skip[i])return;make(resolveChild(ch),n.id,ch.n)});
  return n;
}
function nodeToKit(n,name){
  var k={id:uid(),n:name,ic:n.ic,co:n.co,t:n.t,cat:'Mis kits',desc:'Guardado desde «'+n.n+'»',tags:n.tags.slice(),scope:'personal'};
  if(n.t==='file'){k.blocks=n.blocks.map(function(b){
    var s={type:b.type,title:b.title};
    if(b.type==='ficha')s.fields=b.data.fields.map(function(f){return [f.l,f.type,(f.o||[]).join('|')]});
    if(b.type==='tabla')s.cols=b.data.cols.slice();
    return s})}
  else{k.children=kids(n.id).map(function(c){var sub=nodeToKit(c,c.n);return {n:c.n,spec:sub}})}
  return k;
}

/* ---------- utilidades de árbol ---------- */
function kids(id){return Object.keys(db.nodes).map(function(k){return db.nodes[k]}).filter(function(n){return n.p===id&&!n.del}).sort(function(a,b){if(a.t!==b.t)return a.t==='folder'?-1:1;return a.c-b.c})}
function alive(n){var x=n;while(x){if(x.del)return false;x=db.nodes[x.p]}return true}
function allNodes(){return Object.keys(db.nodes).map(function(k){return db.nodes[k]}).filter(alive)}
function descendants(id){var out=[];kids(id).forEach(function(c){out.push(c);out=out.concat(descendants(c.id))});return out}
function ancestors(n){var a=[];var x=n;while(x){a.unshift(x);x=db.nodes[x.p]}return a}
function vis(n){var x=n;while(x){if(x.vis!=='inherit')return x.vis;x=db.nodes[x.p]}return 'semi'}
function progress(id){var t=0,d=0;var list=[db.nodes[id]].concat(descendants(id));list.forEach(function(n){if(n.t==='file')n.blocks.forEach(function(b){if(b.type==='list')b.data.items.forEach(function(i){t++;if(i.d)d++})})});return {t:t,d:d,p:t?Math.round(d*100/t):0}}
function tagOf(id){for(var i=0;i<db.tags.length;i++)if(db.tags[i].id===id)return db.tags[i];return null}
function tagHtml(id){var t=tagOf(id);return t?'<span class="tg" style="--c:'+t.c+'">'+esc(t.n)+'</span>':''}
function tagsRow(n,editable){var h=n.tags.map(tagHtml).join('');if(editable)h+='<button class="add" data-act="tags" data-id="'+n.id+'">＋ etiqueta</button>';return '<div class="chips">'+h+'</div>'}
function addLog(n,a,d){var e={t:now(),by:db.user.name,a:a,d:d||''};n.log.push(e);db.log.push({t:e.t,by:e.by,a:a,d:d||'',nid:n.id,nn:n.n});if(db.log.length>800)db.log.shift()}
function touch(n){n.u=now();if(!n._le||now()-n._le>300000){addLog(n,'Editó contenido');n._le=now()}save()}

window.addEventListener('popstate',function(e){S=e.state||{tab:'home'};closeSheet();render()});

function sheet(html,keep){var s=$('#sheet');var ob=s.querySelector('.sh-box');var st=(keep&&ob)?ob.scrollTop:0;s.innerHTML='<div class="sh-back" data-act="close"></div><div class="sh-box"><div class="grab"></div>'+html+'</div>';s.classList.add('on')}

function ask(title,val,cb,label){window._ask=cb;sheet('<h3>'+esc(title)+'</h3>'+(label?'<label class="lab">'+esc(label)+'</label>':'')+'<input id="askv" value="'+esc(val||'')+'"><div class="gap"></div><button class="btn" data-act="askok">Guardar</button>');setTimeout(function(){var i=$('#askv');if(i){i.focus();i.select()}},50)}

function rowHtml(n){

function searchRes(q){
  q=q.trim().toLowerCase();if(!q)return '<div class="empty" style="margin-top:14px">Escribe para buscar en todo el estudio.</div>';
  var res=allNodes().filter(function(n){
    if(n.id===db.root)return false;
    if(n.n.toLowerCase().indexOf(q)>=0)return true;
    if(n.tags.some(function(t){var x=tagOf(t);return x&&x.n.toLowerCase().indexOf(q)>=0}))return true;
    return n.blocks.some(function(b){return JSON.stringify(b.data).toLowerCase().indexOf(q)>=0||b.title.toLowerCase().indexOf(q)>=0});
  }).slice(0,50);
  if(!res.length)return '<div class="empty" style="margin-top:14px">Sin resultados.</div>';
  return '<div class="gap"></div>'+res.map(rowHtml).join('');
}

  moveto:function(t){var n=W.mv,d=db.nodes[t.getAttribute('data-id')];if(!n||n.id===d.id)return;if(ancestors(d).indexOf(n)>=0){toast('No puedes mover algo dentro de sí mismo');return}addLog(n,'Movió','de «'+(db.nodes[n.p]||{n:''}).n+'» a «'+d.n+'»');n.p=d.id;n.u=now();save();closeSheet();go({tab:'browse',id:n.id},true);history.replaceState(S,'');render()},
  ndup:function(t){var n=db.nodes[t.getAttribute('data-id')];var c=dup(n,n.p);c.n=n.n+' (copia)';save();closeSheet();toast('Duplicado');go({tab:'browse',id:n.p},true);history.replaceState(S,'');render()},

  ndel:function(t){var n=db.nodes[t.getAttribute('data-id')];confirmSheet('¿Mover a la papelera?','«'+n.n+'» y todo lo que contiene se guardará 30 días y podrás restaurarlo.','Mover a la papelera',function(){n.del=now();addLog(n,'Borró','a la papelera');save();closeSheet();go({tab:'browse',id:n.p},true);history.replaceState(S,'');render()})},
  restore:function(t){var n=db.nodes[t.getAttribute('data-id')];n.del=null;if(!db.nodes[n.p]||!alive(db.nodes[n.p]))n.p=db.root;addLog(n,'Restauró');save();render();toast('Restaurado')},
  purge:function(t){var n=db.nodes[t.getAttribute('data-id')];confirmSheet('¿Borrar para siempre?','No se puede deshacer.','Borrar',function(){[n].concat(Object.keys(db.nodes).map(function(k){return db.nodes[k]}).filter(function(x){return ancestors(x).indexOf(n)>=0})).forEach(function(x){delete db.nodes[x.id]});save();closeSheet();render()})},

  addt:function(t){var g=t.getAttribute('data-g');ask('Nueva etiqueta','',function(v){db.tags.push({id:uid(),g:g,n:v,c:COLORS[db.tags.length%COLORS.length]});save();closeSheet();render()},'Nombre')},

document.addEventListener('click',function(e){var t=e.target.closest('[data-act]');if(!t)return;var f=ACT[t.getAttribute('data-act')];if(f){e.preventDefault();f(t,e)}});
var inT;
document.addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute('data-in');if(!k)return;var v=t.value;
  function nb(){var n=db.nodes[t.getAttribute('data-n')];return {n:n,b:n?blk(n,t.getAttribute('data-b')):null}}
  if(k==='text'){var x=nb();x.b.data.text=v;touch(x.n)}
  else if(k==='item'){var x=nb();x.b.data.items.filter(function(i){return i.id===t.getAttribute('data-i')})[0].t=v;touch(x.n)}
  else if(k==='fv'){var x=nb();var f=x.b.data.fields.filter(function(f){return f.id===t.getAttribute('data-f')})[0];f.v=v;if(f.type==='person'&&v&&db.people.indexOf(v)<0&&v.length>2)clearTimeout(inT),inT=setTimeout(function(){db.people.push(v);save()},900);touch(x.n)}
  else if(k==='cell'){var x=nb();x.b.data.rows[+t.getAttribute('data-r')][+t.getAttribute('data-c')]=v;touch(x.n)}
  else if(k==='colh'){var x=nb();x.b.data.cols[+t.getAttribute('data-c')]=v;touch(x.n)}
  else if(k==='tname'){tagOf(t.getAttribute('data-t')).n=v;save()}
  else if(k==='gname'){db.groups.filter(function(g){return g.id===t.getAttribute('data-g')})[0].n=v;save()}
  else if(k==='uname'){db.user.name=v;save()}
  else if(k==='wn'){W.name=v}
  else if(k==='kitq'){$('#kitlist').innerHTML=kitList(v)}
  else if(k==='ke-n')KE.k.n=v;
  else if(k==='ke-d')KE.k.desc=v;
  else if(k==='ke-btt')KE.k.blocks[+t.getAttribute('data-i')].title=v;
  else if(k==='ke-btx')KE.k.blocks[+t.getAttribute('data-i')].txt=v;
  else if(k==='ke-cn')KE.k.children[+t.getAttribute('data-i')].n=v;
  if(t.id==='sq'){S.q=v;$('#sres').innerHTML=searchRes(v)}
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.getAttribute('data-in');
  if(k==='ptag'){var n=db.nodes[t.getAttribute('data-id')],id=t.getAttribute('data-t');var i=n.tags.indexOf(id);if(t.checked&&i<0)n.tags.push(id);if(!t.checked&&i>=0)n.tags.splice(i,1);addLog(n,'Cambió etiquetas',(t.checked?'+ ':'− ')+tagOf(id).n);n.u=now();save();render()}
  else if(k==='skip'){W.skip[+t.getAttribute('data-i')]=!t.checked}
  else if(k==='ke-bt'){var b=KE.k.blocks[+t.getAttribute('data-i')];b.type=t.value;if(!b.title)b.title='';keRender()}
  else if(k==='ke-ck')KE.k.children[+t.getAttribute('data-i')].k=t.value;
  else if(k==='ke-tag')KE.k.tags=t.value?[t.value]:[];
  else if(k==='fv'){var n=db.nodes[t.getAttribute('data-n')],b=blk(n,t.getAttribute('data-b'));b.data.fields.filter(function(f){return f.id===t.getAttribute('data-f')})[0].v=t.value;touch(n)}
});
$('#imp').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var d=JSON.parse(r.result);if(!d.nodes||!d.root)throw 0;confirmSheet('¿Reemplazar todo?','Se cambiarán tus datos actuales por los del respaldo.','Importar',function(){db=d;saveNow();closeSheet();go({tab:'home'},true);history.replaceState(S,'');toast('Respaldo importado')})}catch(x){toast('El archivo no es un respaldo válido')}};
  r.readAsText(f);e.target.value='';
});
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window._ip=e});

/* ---------- inicio ---------- */
db=load();
if(db){
  db.kits=db.kits||[];
  Object.keys(db.nodes).forEach(function(k){var n=db.nodes[k];if(n.del&&now()-n.del>30*864e5)delete db.nodes[k]});
}
history.replaceState(S,'');
render();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
</script>
