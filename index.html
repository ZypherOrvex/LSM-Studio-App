<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12111F">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>LSM Studio</title>
<style>
:root{--bg:#12111F;--s1:#1B1930;--s2:#252244;--ln:#332F57;--tx:#ECEAFB;--mu:#9B98C2;--ac:#8F7BFF;--ok:#4FD1A5;--dn:#FF6B8A;--r:14px}
[data-theme=light]{--bg:#F5F4FB;--s1:#FFFFFF;--s2:#ECEAF7;--ln:#D9D6EE;--tx:#1B1936;--mu:#6C6896;--ac:#6B54F0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.4}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:var(--tx);background:var(--s2);border:1px solid var(--ln);border-radius:10px;padding:9px 11px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--ac)}
textarea{resize:none;min-height:90px}
h1,h2,h3{margin:0;letter-spacing:-.01em}
small,.mu{color:var(--mu)}
.wrap{max-width:720px;margin:0 auto;padding:0 14px}
/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:8px 0}
.top .wrap{display:flex;align-items:center;gap:8px}
.ib{width:38px;height:38px;border-radius:10px;background:var(--s1);border:1px solid var(--ln);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.crumbs{flex:1;display:flex;gap:4px;overflow-x:auto;white-space:nowrap;scrollbar-width:none;align-items:center}
.crumbs::-webkit-scrollbar{display:none}
.crumb{padding:6px 9px;border-radius:8px;color:var(--mu);font-size:13px}
.crumb.last{color:var(--tx);font-weight:600}
.sep{color:var(--ln)}
/* titles */
.hero{padding:16px 0 6px;display:flex;gap:12px;align-items:center}
.tile{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--s2);border:1px solid var(--c);flex:none}
.tile{background:color-mix(in srgb,var(--c) 22%,var(--s1));border:1px solid color-mix(in srgb,var(--c) 55%,transparent)}
.hero .tile{width:54px;height:54px;font-size:27px}
.hero h1{font-size:22px;line-height:1.15;word-break:break-word}
.sec{margin:20px 0 8px;display:flex;align-items:baseline;justify-content:space-between}
.sec h2{font-size:15px;color:var(--mu);font-weight:600}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin-bottom:10px}
/* rows */
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.row .rt{flex:1;min-width:0}
.row b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;font-size:12.5px}
.chev{color:var(--mu);font-size:20px}
.bar{height:5px;border-radius:5px;background:var(--s2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;align-items:center}
.tg{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:7px;background:var(--c);color:#14122B}
.tgs-outline .tg{background:transparent;color:var(--c);border:1px solid var(--c)}
.tgs-dot .tg{background:transparent;color:var(--tx);padding-left:0}
.tgs-dot .tg::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--c)}
.tgs-pill .tg{border-radius:20px}
.add{border:1px dashed var(--ln);color:var(--mu);border-radius:10px;padding:2px 9px;font-size:12px}
.seg{display:flex;background:var(--s2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--mu)}
.seg button.on{background:var(--ac);color:#fff;font-weight:600}
.btn{background:var(--ac);color:#fff;font-weight:600;padding:11px 16px;border-radius:12px;text-align:center;display:block;width:100%}
.btn.ghost{background:var(--s2);color:var(--tx)}
.btn.dn{background:var(--dn);color:#14122B}
.btn.sm{display:inline-block;width:auto;padding:7px 12px;font-size:13px}
.gap{height:8px}
.empty{text-align:center;color:var(--mu);padding:26px 10px;border:1px dashed var(--ln);border-radius:var(--r)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:10px}
.stat b{font-size:24px;display:block}
.stat small{font-size:12px}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--s1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
.nav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;height:62px}
.nav button.t{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--mu);font-size:11px}
.nav button.t span{font-size:20px}
.nav button.t.on{color:var(--ac);font-weight:700}
.fab{width:56px;height:56px;border-radius:18px;background:var(--ac);color:#fff;font-size:30px;margin:-22px auto 0;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.35)}
/* sheet */
#sheet{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:none}
#sheet.on{display:block}
.sh-back{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,4,15,.6)}
.sh-box{position:absolute;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));border-top:1px solid var(--ln);max-width:720px;margin:0 auto}
.grab{width:42px;height:4px;border-radius:4px;background:var(--ln);margin:4px auto 12px}
.sh-box h3{font-size:18px;margin-bottom:10px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);padding:12px;margin-bottom:8px}
.opt .em{font-size:24px;width:34px;text-align:center}
.opt b{display:block}
.opt small{display:block}
.lab{display:block;font-size:12.5px;color:var(--mu);margin:12px 0 5px}
.icons{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.icons button{font-size:22px;padding:6px;border-radius:10px;background:var(--s1);border:1px solid var(--ln)}
.icons button.on{border-color:var(--ac);background:var(--s2)}
.cols{display:flex;gap:8px;flex-wrap:wrap}
.cols button{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid transparent}
.cols button.on{border-color:var(--tx)}
.chk{display:flex;gap:10px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--ln)}
.chk input{width:20px;height:20px;flex:none}
/* blocks */
.blk{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.bh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-bottom:1px solid var(--ln)}
.bh b{font-size:14px}
.bh .tp{font-size:11.5px;color:var(--mu);margin-left:6px}
.bb{padding:10px 12px}
.li{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.li input.lt{background:transparent;border-color:transparent;padding:6px}
.li.done input.lt{text-decoration:line-through;color:var(--mu)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--ln);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;font-size:14px;font-weight:900}
.ck.on{background:var(--ok);border-color:var(--ok);color:#14122B}
.sm-x{color:var(--mu);font-size:18px;padding:4px 8px}
.fr{display:grid;grid-template-columns:105px 1fr 24px;gap:8px;align-items:center;margin-bottom:8px}
.fr label{font-size:13px;color:var(--mu)}
.tw{overflow-x:auto}
table{border-collapse:collapse;min-width:100%}
td,th{padding:3px;border:1px solid var(--ln)}
td input,th input{border:0;background:transparent;min-width:110px;padding:6px}
th input{font-weight:700}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:var(--s2)}
.lk{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--ln)}
.lk a{color:var(--ac);text-decoration:none;word-break:break-all;flex:1}
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.colm{min-width:220px;flex:none}
.colm h4{margin:0 0 8px;font-size:13px;color:var(--mu)}
.kc{background:var(--s1);border:1px solid var(--ln);border-left:4px solid var(--c);border-radius:12px;padding:10px;margin-bottom:8px;width:100%;text-align:left;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:var(--s1);border:1px solid var(--ln);border-top:4px solid var(--c);border-radius:var(--r);padding:12px;text-align:left}
.gc .em{font-size:28px;display:block;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13.5px;z-index:40;max-width:90%}
.hist{border-left:2px solid var(--ln);padding:0 0 12px 12px;margin-left:6px;position:relative}
.hist::before{content:"";position:absolute;left:-6px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;max-width:460px;margin:0 auto}
.logo{width:76px;height:76px;border-radius:22px;background:linear-gradient(135deg,#8F7BFF,#4FD1A5);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:#14122B;margin-bottom:18px}
.note{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}
/* ================= v0.2 · REDISEÑO ================= */
:root{--bg:#0D0C1B;--s1:#15142A;--s2:#1F1D3A;--ln:#2C2A52;--tx:#EEEDFB;--mu:#9391BA;--ac:#7C6CFF;--ac2:#3DDBB4;--ok:#3DDBB4;--dn:#FF6B8A;--r:18px}
[data-theme=light]{--bg:#F3F2FB;--s1:#FFFFFF;--s2:#EAE8F7;--ln:#D8D5EE;--tx:#17152F;--mu:#68658F;--ac:#6150F0;--ac2:#14A98A;--ok:#14A98A}
body{background:var(--bg);letter-spacing:.005em}
body::before{content:"";position:fixed;top:-120px;right:-120px;width:340px;height:340px;border-radius:50%;background:var(--ac);opacity:.13;filter:blur(70px);pointer-events:none;z-index:0}
#app,.nav,#sheet,#drawer{position:relative;z-index:1}
.nav,#sheet,#drawer{position:fixed}
h1{font-weight:800}
.top{background:var(--bg);background:color-mix(in srgb,var(--bg) 85%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ib{border-radius:12px}
.hero{padding:14px;margin-top:12px;border:1px solid var(--ln);border-radius:22px;background:var(--s1);background:linear-gradient(135deg,var(--s1),color-mix(in srgb,var(--c,var(--ac)) 10%,var(--s1)))}
.tile{border-radius:15px}
.row{border-left-color:var(--ln);position:relative;overflow:hidden;border:1px solid var(--ln);border-left-width:1px;border-radius:18px;padding:11px 12px 11px 16px}
.row::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c,var(--ln))}
.card,.blk{border-radius:18px}
.stat{border-radius:18px;background:var(--s1);background:linear-gradient(160deg,var(--s1),color-mix(in srgb,var(--ac) 9%,var(--s1)))}
.stat b{font-size:26px;font-weight:800}
.btn{background:var(--ac);background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,var(--ac2)));border-radius:14px;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 30%,transparent)}
.btn.ghost,.btn.dnode{box-shadow:none}
.btn.ghost{background:var(--s2)}
.btn.dnode{background:var(--dn)}
.seg{border-radius:14px}.seg button{border-radius:11px}
.seg button.on{background:var(--ac)}
.nav{background:transparent;border:0;padding:0 10px calc(10px + env(safe-area-inset-bottom))}
.nav .in{background:var(--s1);border:1px solid var(--ln);border-radius:26px;height:64px;box-shadow:0 12px 32px rgba(0,0,0,.35);padding:0 4px}
.fab{border-radius:20px;background:var(--ac);background:linear-gradient(135deg,var(--ac),var(--ac2));margin-top:-26px;box-shadow:0 8px 22px color-mix(in srgb,var(--ac) 45%,transparent)}
.sh-box{border-radius:26px 26px 0 0}
.opt{border-radius:16px}
.empty{border-radius:18px}
fieldset.fs{border:0;padding:0;margin:0;min-width:0}
fieldset.fs[disabled]{opacity:.8}
.syncb{font-size:12px;color:var(--mu);padding:0 4px;white-space:nowrap}
.bdg{display:inline-block;font-size:11px;padding:1px 8px;border-radius:8px;background:var(--s2);border:1px solid var(--ln);color:var(--mu)}
.wheel{position:relative;width:240px;height:240px;margin:12px auto;touch-action:none}
.wheel .disc{position:absolute;top:0;left:0;right:0;bottom:0;border-radius:50%;background:radial-gradient(circle closest-side,#fff,rgba(255,255,255,0)),conic-gradient(#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);box-shadow:0 0 0 1px var(--ln)}
.wheel .knob{position:absolute;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px rgba(0,0,0,.55);pointer-events:none;left:120px;top:120px}
.cprev{height:42px;border-radius:12px;border:1px solid var(--ln)}
.cols button.more{background:var(--s2);border:1px solid var(--ln);font-size:16px}
input[type=range]{padding:0;height:30px;accent-color:var(--ac)}
.pm{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--ln)}
.pm button.st{min-width:104px;padding:7px 10px;border-radius:10px;background:var(--s2);border:1px solid var(--ln);font-size:13px}
.pm button.st.a{background:var(--ok);color:#10132A;border-color:transparent}
.pm button.st.d{background:var(--dn);color:#10132A;border-color:transparent}
.icin{font-size:20px;text-align:center}
/* panel lateral */
#drawer{top:0;left:0;bottom:0;right:0;z-index:30;display:none}
#drawer.on{display:block}
#drawer .dbk{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(5,4,15,.62)}
#drawer .dpn{position:absolute;top:0;left:0;bottom:0;width:88%;max-width:360px;background:var(--bg);border-right:1px solid var(--ln);display:flex}
.rail{width:68px;flex:none;background:var(--s1);border-right:1px solid var(--ln);display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0;overflow-y:auto}
.rail button{width:48px;height:48px;border-radius:24px;background:var(--s2);font-size:22px;display:flex;align-items:center;justify-content:center;transition:border-radius .15s;border:2px solid transparent;flex:none}
.rail button.on{border-radius:16px;border-color:var(--ac)}
.rail .sp{flex:1}
.dtree{flex:1;min-width:0;overflow-y:auto;padding:14px 10px calc(20px + env(safe-area-inset-bottom))}
.dtree h2{font-size:17px;margin:0 6px 2px}
.dtree .sub{color:var(--mu);font-size:12px;margin:0 6px 12px}
.dnode{display:flex;align-items:center;gap:2px;margin:1px 0}
.dnode .ar{width:26px;height:34px;color:var(--mu);font-size:11px;flex:none}
.dnode .nm{flex:1;min-width:0;display:flex;gap:8px;align-items:center;text-align:left;padding:7px 8px;border-radius:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnode .nm.on{background:var(--s2);font-weight:700}
.dnode .nm span.t{overflow:hidden;text-overflow:ellipsis}
.dkids{margin-left:14px;border-left:1px solid var(--ln);padding-left:4px}

</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="drawer"></div>
<datalist id="people"></datalist>
<input type="file" id="imp" accept="application/json,.json" style="display:none">
<script src="config.js"></script>
<script>
(function(){
'use strict';
var KEY='lsm_studio_v01';
var COLORS=['#8F7BFF','#5EA8FF','#4FD1A5','#F2C94C','#FF9F5A','#FF6B8A','#C77DFF','#9AA3B2'];
var ICONS=['📁','📂','📄','📝','✅','💡','🎯','🔍','🎬','🎭','👤','👥','🔧','📦','🌐','📱','💻','🏠','📚','🐞','⚙️','⭐','🔒','🔔','🖼','🔗','🎮','🎵','🚀','🛠','📅','📊','💬','🤖','🗂'];
var FT={text:'Texto',date:'Fecha',person:'Persona',number:'Número',link:'Enlace',select:'Opciones'};
var BT={text:['📝','Texto','Escribir libremente'],list:['✅','Lista','Pendientes con casillas'],ficha:['📋','Ficha','Campos ordenados'],tabla:['▦','Tabla','Filas y columnas'],links:['🔗','Enlaces','Fuentes y referencias'],gallery:['🖼','Galería','Imágenes por enlace'],files:['📎','Archivos','Adjuntos (llega con Drive)']};
var VIS={inherit:'Heredar',public:'Público',semi:'Semi público',private:'Privado'};
var VICO={public:'🌐',semi:'🔔',private:'🔒'};
var $=function(s){return document.querySelector(s)};
var uid=function(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)};
var now=function(){return Date.now()};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
function fmt(t){var d=new Date(t);return d.toLocaleDateString('es',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'})}

/* ---------- datos ---------- */
var db=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
var saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
function saveNow(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('No se pudo guardar (almacenamiento lleno)')}}
function defTags(){
  var e=[['t_idea','Idea','#C77DFF'],['t_pend','Pendiente','#9AA3B2'],['t_proc','En proceso','#5EA8FF'],['t_rev','En revisión','#F2C94C'],['t_ok','Terminado','#4FD1A5'],['t_pau','Pausado','#FF9F5A'],['t_can','Cancelado','#FF6B8A']];
  var p=[['t_baja','Baja','#4FD1A5'],['t_media','Media','#F2C94C'],['t_alta','Alta','#FF9F5A'],['t_urg','Urgente','#FF6B8A']];
  var out=[];e.forEach(function(x){out.push({id:x[0],g:'g_estado',n:x[1],c:x[2]})});p.forEach(function(x){out.push({id:x[0],g:'g_prio',n:x[1],c:x[2]})});return out;
}
function newDb(name,color){
  db={v:1,user:{name:name,color:color},nodes:{},kits:[],tags:defTags(),groups:[{id:'g_estado',n:'Estado'},{id:'g_prio',n:'Prioridad'}],log:[],people:['Luka','Lumedia','Michelino'],set:{theme:'dark',tagStyle:'fill'},root:null};
  if(db.people.indexOf(name)<0)db.people.push(name);
  var r=make({t:'folder',n:'LSM Studio',ic:'🏠',co:'#8F7BFF',children:[]},null,'LSM Studio');
  r.vis='semi';db.root=r.id;saveNow();
}

/* ---------- bloques y kits ---------- */
function makeBlock(s){
  var b={id:uid(),type:s.type,title:s.title||BT[s.type][1],data:{}};
  if(s.type==='text')b.data={text:''};
  else if(s.type==='list')b.data={items:[]};
  else if(s.type==='ficha')b.data={fields:(s.fields||[]).map(function(f){return {id:uid(),l:f[0],type:f[1]||'text',v:'',o:f[2]?String(f[2]).split('|'):[]}})};
  else if(s.type==='tabla')b.data={cols:(s.cols||['Columna 1','Columna 2']).slice(),rows:[]};
  else if(s.type==='links'||s.type==='gallery')b.data={items:[]};
  return b;
}
function FK(id,n,ic,co,cat,desc,blocks,tags){return {id:id,t:'file',n:n,ic:ic,co:co,cat:cat,desc:desc,blocks:blocks,tags:tags||[],builtin:true}}

var EMPTY_FILE={id:null,t:'file',n:'Archivo nuevo',ic:'📄',co:'#9AA3B2',blocks:[],tags:[]};

function allKits(){return BUILTIN.concat(db.kits)}
function getKit(id){var a=allKits();for(var i=0;i<a.length;i++)if(a[i].id===id)return a[i];return null}
function resolveChild(ch){if(ch.spec)return ch.spec;if(ch.k){var k=getKit(ch.k);if(k)return k}return ch.t==='file'?EMPTY_FILE:EMPTY_FOLDER}
function make(spec,parent,name,skip){
  var n={id:uid(),p:parent,t:spec.t,n:name||spec.n,ic:spec.ic,co:spec.co,k:spec.id||null,vis:'inherit',tags:(spec.tags||[]).slice(),blocks:[],view:'list',log:[],c:now(),u:now(),by:db.user.name,del:null};
  db.nodes[n.id]=n;
  if(spec.t==='file')(spec.blocks||[]).forEach(function(b){n.blocks.push(makeBlock(b))});
  addLog(n,'Creó',spec.id?'con el kit «'+spec.n+'»':(spec.t==='folder'&&!spec.children?'':'vacío'));
  if(spec.t==='folder')(spec.children||[]).forEach(function(ch,i){if(skip&&skip[i])return;make(resolveChild(ch),n.id,ch.n)});
  return n;
}
function nodeToKit(n,name){
  var k={id:uid(),n:name,ic:n.ic,co:n.co,t:n.t,cat:'Mis kits',desc:'Guardado desde «'+n.n+'»',tags:n.tags.slice(),scope:'personal'};
  if(n.t==='file'){k.blocks=n.blocks.map(function(b){
    var s={type:b.type,title:b.title};
    if(b.type==='ficha')s.fields=b.data.fields.map(function(f){return [f.l,f.type,(f.o||[]).join('|')]});
    if(b.type==='tabla')s.cols=b.data.cols.slice();
    return s})}
  else{k.children=kids(n.id).map(function(c){var sub=nodeToKit(c,c.n);return {n:c.n,spec:sub}})}
  return k;
}

/* ---------- utilidades de árbol ---------- */
function kids(id){return Object.keys(db.nodes).map(function(k){return db.nodes[k]}).filter(function(n){return n.p===id&&!n.del}).sort(function(a,b){if(a.t!==b.t)return a.t==='folder'?-1:1;return a.c-b.c})}
function alive(n){var x=n;while(x){if(x.del)return false;x=db.nodes[x.p]}return true}
function allNodes(){return Object.keys(db.nodes).map(function(k){return db.nodes[k]}).filter(alive)}
function descendants(id){var out=[];kids(id).forEach(function(c){out.push(c);out=out.concat(descendants(c.id))});return out}
function ancestors(n){var a=[];var x=n;while(x){a.unshift(x);x=db.nodes[x.p]}return a}
function vis(n){var x=n;while(x){if(x.vis!=='inherit')return x.vis;x=db.nodes[x.p]}return 'semi'}
function progress(id){var t=0,d=0;var list=[db.nodes[id]].concat(descendants(id));list.forEach(function(n){if(n.t==='file')n.blocks.forEach(function(b){if(b.type==='list')b.data.items.forEach(function(i){t++;if(i.d)d++})})});return {t:t,d:d,p:t?Math.round(d*100/t):0}}
function tagOf(id){for(var i=0;i<db.tags.length;i++)if(db.tags[i].id===id)return db.tags[i];return null}
function tagHtml(id){var t=tagOf(id);return t?'<span class="tg" style="--c:'+t.c+'">'+esc(t.n)+'</span>':''}
function tagsRow(n,editable){var h=n.tags.map(tagHtml).join('');if(editable)h+='<button class="add" data-act="tags" data-id="'+n.id+'">＋ etiqueta</button>';return '<div class="chips">'+h+'</div>'}
function addLog(n,a,d){var e={t:now(),by:db.user.name,a:a,d:d||''};n.log.push(e);db.log.push({t:e.t,by:e.by,a:a,d:d||'',nid:n.id,nn:n.n});if(db.log.length>800)db.log.shift()}
function touch(n){n.u=now();if(!n._le||now()-n._le>300000){addLog(n,'Editó contenido');n._le=now()}save()}

function searchRes(q){
  q=q.trim().toLowerCase();if(!q)return '<div class="empty" style="margin-top:14px">Escribe para buscar en todo el estudio.</div>';
  var res=allNodes().filter(function(n){
    if(n.id===db.root)return false;
    if(n.n.toLowerCase().indexOf(q)>=0)return true;
    if(n.tags.some(function(t){var x=tagOf(t);return x&&x.n.toLowerCase().indexOf(q)>=0}))return true;
    return n.blocks.some(function(b){return JSON.stringify(b.data).toLowerCase().indexOf(q)>=0||b.title.toLowerCase().indexOf(q)>=0});
  }).slice(0,50);
  if(!res.length)return '<div class="empty" style="margin-top:14px">Sin resultados.</div>';
  return '<div class="gap"></div>'+res.map(rowHtml).join('');
}

  else out.children=k.children.map(function(c){return c.spec?{n:c.n||c.spec.n,spec:c.spec}:(c.k==='@file'?{n:c.n||'Archivo',t:'file'}:(c.k?{n:c.n||'Pieza',k:c.k}:{n:c.n||'Carpeta',t:'folder'}))});
  var idx=-1;db.kits.forEach(function(x,i){if(x.id===out.id)idx=i});

  save();var cb=KE.cb;KE=null;if(cb)cb(out);else{closeSheet();render();toast('Kit guardado')}
}

function dup(n,parent){
  var c=JSON.parse(JSON.stringify(n));c.id=uid();c.p=parent;c.log=[];c.c=now();c.u=now();c.by=db.user.name;c.del=null;

    api('/rest/v1/node_index?space_id=eq.'+sid+'&select=*'),
    api('/rest/v1/nodes?space_id=eq.'+sid+'&select=id'),
    api('/rest/v1/nodes?space_id=eq.'+sid+'&updated_at=gt.'+encodeURIComponent(since)+'&select=*&order=updated_at.asc')
  ]).then(function(res){
    var idx=res[0],vid={},inIdx={},changed=false,need=[];

    Object.keys(db.nodes).forEach(function(id){var n=db.nodes[id];if(inIdx[id]||n.fake)return;if(!n.lock&&SYN[id]===undefined)return;delete db.nodes[id];delete SYN[id];changed=true});
    idx.forEach(function(r){
      var n=db.nodes[r.id];
      if(!n){n=db.nodes[r.id]=stubOf(r);changed=true}
      if(vid[r.id]&&n.lock)need.push(r.id);
      if(!vid[r.id]&&!n.lock&&dirtyFree(n)){db.nodes[r.id]=stubOf(r);delete SYN[r.id];changed=true}

/* ---------- selector de color (rueda + HEX) e ícono por teclado ---------- */
function hex2hsv(hx){hx=String(hx||'').replace('#','');if(hx.length===3)hx=hx.split('').map(function(c){return c+c}).join('');if(!/^[0-9a-fA-F]{6}$/.test(hx))return null;var r=parseInt(hx.slice(0,2),16)/255,g=parseInt(hx.slice(2,4),16)/255,b=parseInt(hx.slice(4,6),16)/255;var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return {h:h,s:mx?d/mx:0,v:mx}}
function hsv2hex(h,s,v){var c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c,r=0,g=0,b=0;if(h<60){r=c;g=x}else if(h<120){r=x;g=c}else if(h<180){g=c;b=x}else if(h<240){g=x;b=c}else if(h<300){r=x;b=c}else{r=c;b=x}function t(z){return ('0'+Math.round((z+m)*255).toString(16)).slice(-2)}return ('#'+t(r)+t(g)+t(b)).toUpperCase()}
function colorSheet(cur,done,cancel){
  var hv=hex2hsv(cur)||{h:250,s:.5,v:1};CS={h:hv.h,s:hv.s,v:hv.v,done:done,cancel:cancel};
  var rec=(db&&db.set&&db.set.recent)||[];
  sheet('<h3>Elegir color</h3><div class="wheel" id="wheel"><div class="disc" id="disc"></div><div class="knob" id="knob"></div></div><label class="lab">Brillo</label><input type="range" id="cv" min="5" max="100" data-in="cv"><label class="lab">Código HEX (puedes pegar uno)</label><div class="li"><div class="cprev" id="cprev" style="width:64px;flex:none"></div><input id="chex" data-in="chex" maxlength="7" autocapitalize="characters"></div>'+(rec.length?'<label class="lab">Usados hace poco</label><div class="cols">'+rec.map(function(c){return '<button data-act="cuse" data-c="'+c+'" style="--c:'+c+'"></button>'}).join('')+'</div>':'')+'<div class="gap"></div><button class="btn" data-act="cdone">Usar este color</button><div class="gap"></div><button class="btn ghost" data-act="ccancel">Cancelar</button>');
  csUpdate(false);
}
function csUpdate(keepHex){
  var k=$('#knob');if(!k||!CS)return;var R=120,hx=hsv2hex(CS.h,CS.s,CS.v);
  k.style.left=(R+CS.s*R*Math.sin(CS.h*Math.PI/180))+'px';k.style.top=(R-CS.s*R*Math.cos(CS.h*Math.PI/180))+'px';k.style.background=hx;
  $('#disc').style.filter='brightness('+CS.v+')';$('#cprev').style.background=hx;$('#cv').value=Math.round(CS.v*100);if(!keepHex)$('#chex').value=hx;
}
function csPoint(e){var w=$('#wheel');if(!w||!CS)return;var r=w.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),R=r.width/2;CS.s=Math.min(1,Math.sqrt(dx*dx+dy*dy)/R);var a=Math.atan2(dx,-dy)*180/Math.PI;if(a<0)a+=360;CS.h=a;csUpdate(false)}

  if(!SP||SPMODE!=='edit'||SP.id!==s.id){SP={id:s.id,n:s.name,ic:s.icon,co:s.color,d:s.description||''};SPMODE='edit'}
  var h=subHead('Ajustes del espacio')+'<div class="wrap">';
  if(!adm)h+='<div class="note">Solo los administradores pueden cambiar esto.</div>';
  h+='<fieldset class="fs"'+(adm?'':' disabled')+'><label class="lab">Nombre</label><input data-in="sp-n" value="'+esc(SP.n)+'"><label class="lab">Descripción</label><textarea data-in="sp-d" style="min-height:64px">'+esc(SP.d)+'</textarea><label class="lab">Ícono</label>'+iconPicker(SP.ic,'sp-ic','SP')+'<label class="lab">Color</label>'+colorPicker(SP.co,'sp-co')+'<div class="gap"></div><button class="btn" data-act="sp-save">Guardar cambios</button></fieldset>';
  h+='<div class="sec"><h2>Zona delicada</h2></div>';
  if(owner)h+='<button class="btn ghost" data-act="sp-transfer">Transferir el espacio</button><div class="gap"></div><button class="btn dn" data-act="sp-delete">Eliminar el espacio</button>';
  else h+='<button class="btn dn" data-act="sp-leave">Salir del espacio</button>';
  return h+'</div>';
}
function vMembers(){
  var c=db.cloud,canR=spacePerm('manage_roles');
  var h=subHead('Miembros')+'<div class="wrap"><div class="gap"></div>';
  c.members.forEach(function(m){
    var r=c.roles.filter(function(x){return x.id===m.role_id})[0];
    h+='<div class="card"><div class="li"><span class="tile" style="--c:'+esc(m.color||'#8F7BFF')+';width:38px;height:38px">'+esc((m.name||'?').slice(0,1).toUpperCase())+'</span><div style="flex:1;min-width:0"><b>'+esc(m.name)+(m.user_id===c.me.id?' (tú)':'')+'</b><br><small>'+(m.owner?'👑 Propietario':(r?esc(r.name):'Sin rol'))+'</small></div>'+(c.isAdmin&&!m.owner&&m.user_id!==c.me.id?'<button class="sm-x" data-act="rmmem" data-u="'+m.user_id+'">✕</button>':'')+'</div>';
    if(canR&&!m.owner)h+='<select data-in="mrole" data-u="'+m.user_id+'"><option value="">Elegir rol…</option>'+c.roles.filter(function(x){return !x.is_base&&(!x.is_admin||c.isAdmin)}).map(function(x){return '<option value="'+x.id+'"'+(x.id===m.role_id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</select>';
    h+='</div>';
  });
  return h+'</div>';
}
function vRoles(){
  var c=db.cloud,canR=spacePerm('manage_roles');
  var h=subHead('Roles y permisos')+'<div class="wrap"><div class="gap"></div><div class="note">Los roles de arriba mandan sobre los de abajo. El rol <b>Todos</b> se aplica a cualquier miembro.</div>';
  if(canR)h+='<button class="btn" data-act="newrole">＋ Crear rol</button><div class="gap"></div>';
  var list=c.roles.slice().sort(function(a,b){return b.position-a.position});

    h+='<div class="row" style="--c:'+esc(r.color)+'"><span class="tile" style="--c:'+esc(r.color)+'">'+(r.is_admin?'👑':r.is_base?'🌐':'🛡')+'</span><button class="rt" style="text-align:left" data-act="roleopen" data-r="'+r.id+'"><b>'+esc(r.name)+'</b><small>'+(r.is_admin?'Salta todos los permisos':r.is_base?'Base para todos':n+' persona'+(n===1?'':'s'))+'</small></button>'+(canR&&!r.is_base&&!r.is_admin?'<button class="sm-x" data-act="roleup" data-r="'+r.id+'">⬆</button><button class="sm-x" data-act="roledown" data-r="'+r.id+'">⬇</button>':'')+'</div>';
  });

}

  var c=db.cloud,r=RE.r,canR=spacePerm('manage_roles');

  var dis=r.is_admin?' disabled':'';

  h+='<div class="sec"><h2>En carpetas y archivos</h2></div>'+PERMS_NODE.map(function(p){return '<label class="chk"><input type="checkbox" data-in="rperm" data-p="'+p[0]+'"'+(r.perms[p[0]]?' checked':'')+dis+'>'+p[1]+'</label>'}).join('');

function vInv(){
  var h=subHead('Invitaciones')+'<div class="wrap"><div class="gap"></div>';
  if(!spacePerm('invite'))return h+'<div class="note">No tienes permiso para invitar personas.</div></div>';
  h+='<button class="btn" data-act="newinv">＋ Crear invitación</button><div class="gap"></div>';
  if(INV===null)return h+'<div class="empty">Cargando…</div></div>';
  if(!INV.length)h+='<div class="empty">Aún no hay invitaciones.</div>';
  var link=location.origin+location.pathname;
  INV.forEach(function(i){var r=db.cloud.roles.filter(function(x){return x.id===i.role_id})[0];
    h+='<div class="card"><div class="li"><b style="font-size:20px;letter-spacing:2px;flex:1">'+esc(i.code)+'</b><button class="sm-x" data-act="invdel" data-code="'+esc(i.code)+'">✕</button></div><small>Entra como <b>'+esc(r?r.name:'Miembro')+'</b> · '+i.uses+(i.max_uses?'/'+i.max_uses:'')+' usos · '+(i.expires_at?'vence '+new Date(i.expires_at).toLocaleDateString('es'):'no vence')+'</small><div class="gap"></div><button class="btn sm ghost" data-act="invcopy" data-v="'+esc(i.code)+'">Copiar código</button> <button class="btn sm ghost" data-act="invcopy" data-v="'+esc(link+'?join='+i.code)+'">Copiar enlace</button></div>'});
  return h+'</div>';
}
function vReqs(){
  var c=db.cloud,list=c.reqs.filter(function(r){return r.user_id!==c.me.id});

  return h+'</div>';
}
function vSlog(){
  var h=subHead('Actividad del espacio')+'<div class="wrap"><div class="gap"></div>';
  if(SLOG===null)return h+'<div class="empty">Cargando…</div></div>';
  if(!SLOG.length)h+='<div class="empty">Sin movimientos.</div>';
  SLOG.forEach(function(e){var n=e.node_id?db.nodes[e.node_id]:null;h+='<div class="hist"><b>'+esc(e.action)+'</b>'+(n?' · '+esc(n.n):'')+(e.detail?' · '+esc(e.detail):'')+'<br><small>'+esc(memberName(e.user_id))+' · '+fmt(Date.parse(e.created_at))+'</small></div>'});

/* ---------- ajustes de carpeta o archivo ---------- */
function nsOpen(id,tab){var n=db.nodes[id];if(!NS||NS.id!==id)NS={id:id,tab:'look',name:n.n,ic:n.ic,co:n.co};if(tab)NS.tab=tab;nsRender()}
function subjName(type,id){var c=db.cloud;if(type==='role'){var r=c.roles.filter(function(x){return x.id===id})[0];return (r&&r.is_base?'🌐 ':'🛡 ')+(r?r.name:'Rol')}return '👤 '+memberName(id)}
function nsRender(){
  var n=db.nodes[NS.id],t=NS.tab,cm=can(n,'manage_perms'),ce=can(n,'edit');
  var h='<h3>Ajustes · '+esc(n.n)+'</h3><div class="seg">'+[['look','Apariencia'],['perm','Permisos'],['prot','Protección']].map(function(x){return '<button class="'+(t===x[0]?'on':'')+'" data-act="ns-tab" data-t="'+x[0]+'">'+x[1]+'</button>'}).join('')+'</div>';
  if(t==='look'){
    h+=(ce?'':'<div class="note">No tienes permiso para editar la apariencia.</div>')+'<fieldset class="fs"'+(ce?'':' disabled')+'><label class="lab">Nombre</label><input data-in="ns-n" value="'+esc(NS.name)+'"><label class="lab">Ícono</label>'+iconPicker(NS.ic,'ns-ic','NS')+'<label class="lab">Color</label>'+colorPicker(NS.co,'ns-co')+'<div class="gap"></div><button class="btn" data-act="ns-save">Guardar</button></fieldset>';
  }else if(t==='perm'){
    h+='<label class="lab">Visibilidad</label><div class="seg">'+['inherit','public','semi','private'].map(function(v){return '<button class="'+(n.vis===v?'on':'')+'" data-act="ns-vis" data-v="'+v+'">'+VIS[v]+'</button>'}).join('')+'</div><small>Ahora: '+VICO[vis(n)]+' '+VIS[vis(n)]+(n.vis==='inherit'?' (heredada)':'')+'</small>';
    if(n.t==='folder')h+='<label class="chk"><input type="checkbox" id="nsall"> Aplicar también a todo lo que contiene</label>';
    if(!db.cloud)h+='<div class="note">Los permisos por rol y por persona se activan al entrar con una cuenta (menú Más → Cuenta y espacios).</div>';
    else if(!cm)h+='<div class="note">No tienes permiso para cambiar los permisos de aquí.</div>';
    else{
      h+='<div class="sec"><h2>Quién puede hacer qué aquí</h2></div>';
      var seen={},c=db.cloud;(c.permsBy[n.id]||[]).forEach(function(e){seen[e.subject_type+'|'+e.subject_id]=1});
      var keys=Object.keys(seen);
      if(!keys.length)h+='<div class="empty">Sin reglas propias: usa lo que hereda de arriba y de los roles.</div>';
      keys.forEach(function(k){var p=k.split('|'),es=(c.permsBy[n.id]||[]).filter(function(e){return e.subject_type===p[0]&&e.subject_id===p[1]});var a=es.filter(function(e){return e.effect==='allow'}).length,d=es.length-a;
        h+='<button class="opt" data-act="ps-open" data-t="'+p[0]+'" data-s="'+esc(p[1])+'"><span class="em">'+(p[0]==='role'?'🛡':'👤')+'</span><span><b>'+esc(subjName(p[0],p[1]).replace(/^..\s/,''))+'</b><small>✅ '+a+' permitidos · ❌ '+d+' denegados</small></span></button>'});
      h+='<button class="btn ghost" data-act="ps-add">＋ Rol o persona</button>'+(keys.length?'<div class="gap"></div><button class="btn ghost" data-act="ps-sync">↩ Quitar reglas y heredar de la carpeta de arriba</button>':'');
    }
  }else{
    var lk=!!(n.settings&&n.settings.locked);
    h+='<div class="note">Bloquear deja el elemento en <b>solo lectura</b> para todos, menos para quien gestiona sus permisos.</div><button class="btn '+(lk?'dn':'')+'" data-act="ns-lock" '+(cm?'':'disabled')+'>'+(lk?'🔓 Quitar bloqueo':'🔒 Bloquear (solo lectura)')+'</button><div class="gap"></div><button class="btn ghost" data-act="hist" data-id="'+n.id+'">🕘 Ver historial</button>';
  }
  sheet(h,true);
}
function curEffect(type,sid){var n=db.nodes[PS.node];var e=(db.cloud.permsBy[n.id]||[]).filter(function(x){return x.subject_type===type&&x.subject_id===sid&&x.perm===PS.cur})[0];return e?e.effect:null}
function psRender(){
  var n=db.nodes[PS.node],c=db.cloud;
  var rows=PERMS_NODE.map(function(p){var e=(c.permsBy[n.id]||[]).filter(function(x){return x.subject_type===PS.type&&x.subject_id===PS.id&&x.perm===p[0]})[0];e=e?e.effect:null;
    return '<div class="pm"><span>'+p[1]+'</span><button class="st '+(e==='allow'?'a':e==='deny'?'d':'')+'" data-act="ps-cyc" data-p="'+p[0]+'">'+(e==='allow'?'✅ Permitir':e==='deny'?'❌ Denegar':'➖ Heredar')+'</button></div>'}).join('');
  sheet('<h3>'+esc(subjName(PS.type,PS.id))+'</h3><p class="mu">En «'+esc(n.n)+'». <b>Heredar</b> usa lo de arriba o lo del rol. Lo más cercano gana, y denegar gana sobre permitir.</p>'+rows+'<div class="gap"></div><button class="btn ghost" data-act="ps-back">← Atrás</button>',true);
}
function permSync(){permsIndex()}
function histSheet(n){
  if(!db.cloud){var h='<h3>Historial de «'+esc(n.n)+'»</h3><div class="note">Solo se agregan registros. No se pueden editar ni borrar.</div>';n.log.slice().reverse().forEach(function(e){h+='<div class="hist"><b>'+esc(e.a)+'</b>'+(e.d?' · '+esc(e.d):'')+'<br><small>'+esc(e.by)+' · '+fmt(e.t)+'</small></div>'});sheet(h);return}
  sheet('<h3>Historial de «'+esc(n.n)+'»</h3><div class="empty">Cargando…</div>');
  api('/rest/v1/log?node_id=eq.'+n.id+'&order=created_at.desc&limit=100&select=*').then(function(rows){
    var h='<h3>Historial de «'+esc(n.n)+'»</h3><div class="note">Solo se agregan registros. No se pueden editar ni borrar.</div>';
    if(!rows.length)h+='<div class="empty">Sin registros todavía.</div>';
    rows.forEach(function(e){h+='<div class="hist"><b>'+esc(e.action)+'</b>'+(e.detail?' · '+esc(e.detail):'')+'<br><small>'+esc(memberName(e.user_id))+' · '+fmt(Date.parse(e.created_at))+'</small></div>'});
    sheet(h);
  }).catch(function(e){sheet('<h3>Historial</h3><div class="note">'+esc(e.status?e.message:'Sin conexión: el historial del servidor no está disponible.')+'</div>')});
}
function createSpaceSheet(){

}
function roleDefaults(){return {name:'',color:COLORS[1],position:40,is_admin:false,is_base:false,perms:{view:true,comment:true}}}

function guardAct(name,perm,attr){var f=ACT[name];ACT[name]=function(t,e){var n=db.nodes[t.getAttribute(attr||'data-id')];if(db.cloud&&n&&!can(n,perm)){toast('No tienes permiso para esto');return}f(t,e)}}
['tags','setstate','nedit'].forEach(function(a){guardAct(a,'edit')});
guardAct('nvis','manage_perms');guardAct('nmove','move');guardAct('ndel','delete');
var _enter=ACT.enter;ACT.enter=function(t,e){localStorage.setItem('lsm_mode','local');_enter(t,e)};
var _sub=ACT.sub;ACT.sub=function(t){var s=t.getAttribute('data-s');if(s==='invites')INV=null;if(s==='slog'||s==='log')SLOG=null;_sub(t);if(db&&db.cloud){if(s==='invites')loadInv();if(s==='slog'||s==='log')loadSlog()}};
var _import=ACT['import'];ACT['import']=function(t,e){if(db&&db.cloud){closeSheet();toast('Importar solo funciona en modo local');return}_import(t,e)};
ACT.create=function(){var p=(S.tab==='browse'&&db.nodes[S.id]&&db.nodes[S.id].t==='folder'&&!db.nodes[S.id].lock)?S.id:db.root;if(!can(db.nodes[p],'create')){toast('No tienes permiso para crear aquí');return}startCreate(p)};

ACT['sp-create']=function(){
  if(!SP.n.trim()){toast('Ponle nombre al espacio');return}
  closeSheet();LOADING=true;render();
  rpc('create_space',{p_name:SP.n.trim(),p_icon:SP.ic,p_color:SP.co,p_tags:defTags(),p_groups:[{id:'g_estado',n:'Estado'},{id:'g_prio',n:'Prioridad'}]}).then(function(id){
    return api('/rest/v1/spaces?select=id,name,icon,color,description,owner_id&order=created_at').then(function(l){SPACES=l;return openSpace(id)});
  }).catch(function(e){LOADING=false;ERR=e.message;render()});
};
ACT.joinsp=function(){ask('Unirme con un código','',function(v){closeSheet();LOADING=true;render();rpc('join_with_code',{p_code:v}).then(function(sid){return api('/rest/v1/spaces?select=id,name,icon,color,description,owner_id&order=created_at').then(function(l){SPACES=l;return openSpace(sid)})}).catch(function(e){LOADING=false;ERR=e.message;render()})},'Código de invitación')};
['sp-ic','sp-co'].forEach(function(a){ACT[a]=function(t){if(a==='sp-ic')SP.ic=t.getAttribute('data-i');else SP.co=t.getAttribute('data-c');if(SPMODE==='create')createSpaceSheet();else render()}});
ACT['sp-save']=function(){
  if(!SP.n.trim()){toast('Falta el nombre');return}
  api('/rest/v1/spaces?id=eq.'+SP.id,{method:'PATCH',body:{name:SP.n.trim(),icon:SP.ic,color:SP.co,description:SP.d||''},prefer:'return=minimal'}).then(function(){var s=db.cloud.space;s.name=SP.n.trim();s.icon=SP.ic;s.color=SP.co;s.description=SP.d||'';SPACES.forEach(function(x){if(x.id===s.id){x.name=s.name;x.icon=s.icon;x.color=s.color}});cacheSave();render();toast('Guardado')}).catch(function(e){toast(e.message)});
};
ACT['sp-leave']=function(){confirmSheet('¿Salir del espacio?','Perderás el acceso hasta que te vuelvan a invitar.','Salir',function(){var sid=db.cloud.sid;closeSheet();rpc('leave_space',{p_space:sid}).then(function(){localStorage.removeItem('lsm_cache_'+sid);exitSpace()}).catch(function(e){toast(e.message)})})};
ACT['sp-delete']=function(){confirmSheet('¿Eliminar el espacio?','Se borra TODO lo que contiene para todas las personas. No se puede deshacer.','Eliminar para siempre',function(){var sid=db.cloud.sid;closeSheet();rpc('delete_space',{p_space:sid}).then(function(){localStorage.removeItem('lsm_cache_'+sid);exitSpace()}).catch(function(e){toast(e.message)})})};

ACT['role-save']=function(){
  var r=RE.r;if(!r.name.trim()){toast('Ponle nombre al rol');return}
  var c=db.cloud,body={name:r.name.trim(),color:r.color,is_admin:!!r.is_admin,perms:r.perms};
  var p;
  if(RE.isNew){body.space_id=c.sid;body.position=r.position;body.is_base=false;p=api('/rest/v1/roles',{method:'POST',body:body,prefer:'return=minimal'})}
  else p=api('/rest/v1/roles?id=eq.'+r.id,{method:'PATCH',body:body,prefer:'return=minimal'});
  p.then(function(){return pullMeta(true)}).then(function(){toast('Rol guardado');history.back()}).catch(function(e){toast(e.message)});
};
ACT['role-del']=function(){var r=RE.r;confirmSheet('¿Eliminar el rol «'+r.name+'»?','Quienes lo tengan se quedarán sin rol (solo con el rol base «Todos»).','Eliminar',function(){closeSheet();api('/rest/v1/roles?id=eq.'+r.id,{method:'DELETE'}).then(function(){return pullMeta(true)}).then(function(){history.back()}).catch(function(e){toast(e.message)})})};
function moveRole(id,dir){var c=db.cloud,list=c.roles.filter(function(r){return !r.is_base&&!r.is_admin}).sort(function(a,b){return b.position-a.position});var i=list.map(function(r){return r.id}).indexOf(id),j=i+dir;if(i<0||j<0||j>=list.length)return;var a=list[i],b=list[j],pa=a.position,pb=b.position;if(pa===pb){pb=pa-dir}
  Promise.all([api('/rest/v1/roles?id=eq.'+a.id,{method:'PATCH',body:{position:pb},prefer:'return=minimal'}),api('/rest/v1/roles?id=eq.'+b.id,{method:'PATCH',body:{position:pa},prefer:'return=minimal'})]).then(function(){return pullMeta(true)}).catch(function(e){toast(e.message)})}
ACT.roleup=function(t){moveRole(t.getAttribute('data-r'),-1)};
ACT.roledown=function(t){moveRole(t.getAttribute('data-r'),1)};

ACT.reqok=function(t){var id=t.getAttribute('data-r');sheet('<h3>¿Qué nivel de acceso das?</h3><button class="opt" data-act="reqlv" data-r="'+id+'" data-l="view"><span class="em">👁</span><span><b>Ver y comentar</b><small>Solo lectura</small></span></button><button class="opt" data-act="reqlv" data-r="'+id+'" data-l="edit"><span class="em">✏️</span><span><b>Editar</b><small>Ver, crear, editar y subir archivos</small></span></button><button class="opt" data-act="reqlv" data-r="'+id+'" data-l="admin"><span class="em">🛡</span><span><b>Administrar</b><small>Todo, incluidos los permisos</small></span></button>')};

ACT.reqno=function(t){rpc('resolve_request',{p_req:t.getAttribute('data-r'),p_approve:false,p_level:'view'}).then(function(){return pullMeta(true)}).catch(function(e){toast(e.message)})};

['ns-ic','ns-co'].forEach(function(a){ACT[a]=function(t){if(a==='ns-ic')NS.ic=t.getAttribute('data-i');else NS.co=t.getAttribute('data-c');nsRender()}});
ACT['ns-tab']=function(t){NS.tab=t.getAttribute('data-t');nsRender()};
ACT['ns-save']=function(){var n=db.nodes[NS.id];if(!NS.name.trim()){toast('Falta el nombre');return}var ch=[];if(n.n!==NS.name.trim())ch.push('nombre: «'+n.n+'» → «'+NS.name.trim()+'»');if(n.ic!==NS.ic||n.co!==NS.co)ch.push('apariencia');n.n=NS.name.trim();n.ic=NS.ic;n.co=NS.co;addLog(n,'Editó apariencia',ch.join(', '));n.u=now();save();NS=null;closeSheet();render()};
ACT['ns-vis']=function(t){var n=db.nodes[NS.id],v=t.getAttribute('data-v');if(!can(n,'manage_perms')){toast('No tienes permiso para cambiar la visibilidad');return}var all=$('#nsall')&&$('#nsall').checked;addLog(n,'Cambió visibilidad',VIS[n.vis]+' → '+VIS[v]);n.vis=v;if(all)descendants(n.id).forEach(function(d){if(d.lock)return;d.vis='inherit';addLog(d,'Cambió visibilidad','hereda de «'+n.n+'»')});n.u=now();save();nsRender()};
ACT['ns-lock']=function(){var n=db.nodes[NS.id];n.settings=n.settings||{};n.settings.locked=!n.settings.locked;addLog(n,n.settings.locked?'Bloqueó (solo lectura)':'Quitó el bloqueo');n.u=now();save();nsRender()};
ACT['ps-add']=function(){var c=db.cloud;sheet('<h3>Agregar regla para…</h3><div class="sec"><h2>Roles</h2></div>'+c.roles.filter(function(r){return !r.is_admin}).map(function(r){return '<button class="opt" data-act="ps-open" data-t="role" data-s="'+r.id+'"><span class="em">'+(r.is_base?'🌐':'🛡')+'</span><b>'+esc(r.name)+'</b></button>'}).join('')+'<div class="sec"><h2>Personas</h2></div>'+c.members.filter(function(m){return m.user_id!==c.me.id}).map(function(m){return '<button class="opt" data-act="ps-open" data-t="user" data-s="'+m.user_id+'"><span class="em">👤</span><b>'+esc(m.name)+'</b></button>'}).join(''))};
ACT['ps-open']=function(t){PS={node:NS.id,type:t.getAttribute('data-t'),id:t.getAttribute('data-s')};psRender()};
ACT['ps-back']=function(){nsOpen(NS.id,'perm')};
ACT['ps-cyc']=function(t){
  var p=t.getAttribute('data-p'),c=db.cloud,n=PS.node,list=c.permsBy[n]||[];
  var cur=list.filter(function(x){return x.subject_type===PS.type&&x.subject_id===PS.id&&x.perm===p})[0];
  var cu=cur?cur.effect:null,next=cu===null?'allow':(cu==='allow'?'deny':null);
  var req=next?api('/rest/v1/node_perms?on_conflict=node_id,subject_type,subject_id,perm',{method:'POST',body:{node_id:n,subject_type:PS.type,subject_id:PS.id,perm:p,effect:next},prefer:'resolution=merge-duplicates,return=minimal'})
             :api('/rest/v1/node_perms?node_id=eq.'+n+'&subject_type=eq.'+PS.type+'&subject_id=eq.'+encodeURIComponent(PS.id)+'&perm=eq.'+p,{method:'DELETE'});
  req.then(function(){
    c.perms=c.perms.filter(function(x){return !(x.node_id===n&&x.subject_type===PS.type&&x.subject_id===PS.id&&x.perm===p)});
    if(next)c.perms.push({node_id:n,space_id:c.sid,subject_type:PS.type,subject_id:PS.id,perm:p,effect:next});
    permsIndex();addLog(db.nodes[n],'Cambió permisos',subjName(PS.type,PS.id)+' · '+p+' → '+(next||'heredar'));save();psRender();
  }).catch(function(e){toast(e.message)});
};
ACT['ps-sync']=function(){var n=db.nodes[NS.id],c=db.cloud;confirmSheet('¿Quitar todas las reglas?','Este elemento volverá a heredar los permisos de la carpeta de arriba.','Quitar reglas',function(){api('/rest/v1/node_perms?node_id=eq.'+n.id,{method:'DELETE'}).then(function(){c.perms=c.perms.filter(function(x){return x.node_id!==n.id});permsIndex();addLog(n,'Quitó reglas de permisos','hereda de arriba');save();nsRender()}).catch(function(e){toast(e.message)})})};

/* ---------- escritura en campos nuevos ---------- */
document.addEventListener('input',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-in');if(!k)return;var v=t.value;
  if(k==='icin'){var ic=Array.from(v).slice(0,3).join(''),cx=t.getAttribute('data-ctx');if(cx==='W')W.ic=ic;else if(cx==='KE'&&KE)KE.k.ic=ic;else if(cx==='NS'&&NS)NS.ic=ic;else if(cx==='SP'&&SP)SP.ic=ic}
  else if(k==='sp-n')SP.n=v;
  else if(k==='sp-d')SP.d=v;
  else if(k==='ns-n')NS.name=v;
  else if(k==='re-n')RE.r.name=v;
  else if(k==='cv'){CS.v=(+v)/100;csUpdate(true)}
  else if(k==='chex'){var x=v.charAt(0)==='#'?v:'#'+v,hv=hex2hsv(x);if(hv&&/^#?[0-9a-fA-F]{6}$/.test(v)){CS.h=hv.h;CS.s=hv.s;CS.v=hv.v;csUpdate(true)}}
});
document.addEventListener('change',function(e){
  var t=e.target,k=t.getAttribute&&t.getAttribute('data-in');if(!k)return;
  if(k==='rperm'){RE.r.perms[t.getAttribute('data-p')]=t.checked}
  else if(k==='re-adm'){RE.r.is_admin=t.checked;render()}
  else if(k==='mrole'){var u=t.getAttribute('data-u');if(!t.value)return;rpc('set_member_role',{p_space:db.cloud.sid,p_user:u,p_role:t.value}).then(function(){return pullMeta(true)}).catch(function(er){toast(er.message);render()})}
});

/* ---------- panel lateral (estilo Discord) ---------- */
var EXP={},DRAWER=false;
function drawerHtml(){
  var rail='';
  if(db.cloud){
    SPACES.forEach(function(s){rail+='<button class="'+(s.id===db.cloud.sid?'on':'')+'" data-act="dspace" data-id="'+s.id+'" title="'+esc(s.name)+'">'+esc(s.icon)+'</button>'});
    rail+='<span class="sp"></span><button data-act="dnewsp" title="Crear o unirme">＋</button>';
  }else{
    rail+='<button class="on" title="Modo local">🏠</button><span class="sp"></span>'+(CLOUD_ON?'<button data-act="tocloud" title="Cuenta">☁️</button>':'');
  }
  var root=db.nodes[db.root];
  var h='<div class="dbk" data-act="dclose"></div><div class="dpn"><div class="rail">'+rail+'</div><div class="dtree"><h2>'+esc(root?root.ic+' '+root.n:'LSM Studio')+'</h2><div class="sub">'+(db.cloud?esc((myRole()||{}).name||'Miembro')+' · '+db.cloud.members.length+' personas':'Modo local')+'</div>';
  h+='<div class="dnode"><span class="ar"></span><button class="nm'+(S.tab==='home'?' on':'')+'" data-act="dgo" data-t="home">🏠 <span class="t">Inicio</span></button></div>';
  h+='<div class="dnode"><span class="ar"></span><button class="nm'+(S.tab==='search'?' on':'')+'" data-act="dgo" data-t="search">🔍 <span class="t">Buscar</span></button></div>';
  h+='<div class="dnode"><span class="ar"></span><button class="nm'+(S.tab==='more'?' on':'')+'" data-act="dgo" data-t="more">☰ <span class="t">Más y ajustes</span></button></div><div class="gap"></div>';
  h+=treeHtml(db.root,0);
  return h+'</div></div>';
}
function treeHtml(id,depth){
  var out='';
  kids(id).forEach(function(n){
    var isF=n.t==='folder'&&!n.lock,open=!!EXP[n.id],has=isF&&kids(n.id).length>0;
    out+='<div class="dnode"><button class="ar" data-act="dtog" data-id="'+n.id+'">'+(has?(open?'▼':'▶'):'')+'</button><button class="nm'+(S.tab==='browse'&&S.id===n.id?' on':'')+'" data-act="dopen" data-id="'+n.id+'"><span>'+esc(n.ic)+'</span><span class="t">'+esc(n.n)+'</span>'+(n.lock?'<span>🔒</span>':'')+'</button></div>';
    if(has&&open&&depth<6)out+='<div class="dkids">'+treeHtml(n.id,depth+1)+'</div>';
  });
  return out;
}
function drawerOpen(){if(!db)return;var d=$('#drawer');d.innerHTML=drawerHtml();d.classList.add('on');DRAWER=true}
function drawerClose(){var d=$('#drawer');d.classList.remove('on');d.innerHTML='';DRAWER=false}
function drawerRefresh(){if(DRAWER){var t=$('#drawer .dtree'),st=t?t.scrollTop:0;$('#drawer').innerHTML=drawerHtml();var t2=$('#drawer .dtree');if(t2)t2.scrollTop=st}}
ACT.drawer=function(){drawerOpen()};
ACT.dclose=function(){drawerClose()};
ACT.dtog=function(t){var id=t.getAttribute('data-id');EXP[id]=!EXP[id];drawerRefresh()};
ACT.dopen=function(t){drawerClose();go({tab:'browse',id:t.getAttribute('data-id')})};
ACT.dgo=function(t){drawerClose();var x=t.getAttribute('data-t');go({tab:x,id:db.root})};
ACT.dspace=function(t){var id=t.getAttribute('data-id');drawerClose();if(db.cloud&&id===db.cloud.sid)return;openSpace(id)};
ACT.dnewsp=function(){drawerClose();exitSpace()};
/* abrir el panel al deslizar desde el borde izquierdo */
(function(){var sx=null,sy=null;
  document.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX<22?t.clientX:null;sy=t.clientY},{passive:true});
  document.addEventListener('touchend',function(e){if(sx===null||!db)return;var t=e.changedTouches[0];if(t.clientX-sx>70&&Math.abs(t.clientY-sy)<60&&!$('#sheet').classList.contains('on'))drawerOpen();sx=null},{passive:true});
})();
/* barra superior con ☰ en el inicio y botón ☰ en los encabezados */
var _head2=head;
head=function(n,title){return _head2(n,title).replace('<div class="wrap"><button class="ib" data-act="back">','<div class="wrap"><button class="ib" data-act="drawer">☰</button><button class="ib" data-act="back">')};
var _vHome2=vHome;
vHome=function(){
  var top='<div class="top"><div class="wrap"><button class="ib" data-act="drawer">☰</button><div class="crumbs"><span class="crumb last">'+(db.cloud?esc(db.cloud.space.icon+' '+db.cloud.space.name):'🏠 LSM Studio')+'</span></div>'+syncBadge()+'</div></div>';
  return top+_vHome2().replace(/<button class="row" style="--c:[^"]*;margin-top:12px" data-act="switchsp">[\s\S]*?<\/button>/,'');
};
var _render2=render;
render=function(){_render2();drawerRefresh()};
var _go2=go;
go=function(s,np){if(DRAWER)drawerClose();_go2(s,np)};

/* ---------- inicio ---------- */
bootApp();
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(function(){})}
})();
